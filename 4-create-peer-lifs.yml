---
- hosts: localhost
  gather_facts: false
  name: Create Cluster Peer Lifs
  vars:
    login1: &login1
      hostname: 192.168.4.200
      username: admin
      password: apix1234
      https: true
      validate_certs: false
    login2: &login2
      hostname: 192.168.4.202
      username: admin
      password: apix1234
      https: true
      validate_certs: false
    login3: &login3
      hostname: 192.168.4.204
      username: admin
      password: apix1234
      https: true
      validate_certs: false
  tasks:
    - name: Create interface n1 cluster1
      na_ontap_interface:
        state: present
        interface_name: peer-lif-cl1-n1
        home_port: e0c
        home_node: cluster1-01
        role: intercluster
        address: 192.168.4.120
        netmask: 255.255.255.0
        vserver: cluster1
        ipspace: Default
        <<: *login1
    - name: Create interface n1 cluster2
      na_ontap_interface:
        state: present
        interface_name: peer-lif-cl2-n1
        home_port: e0c
        home_node: cluster2-01
        role: intercluster
        address: 192.168.4.121
        netmask: 255.255.255.0
        vserver: cluster2
        ipspace: Default
        <<: *login2
    - name: Create interface n1 cluster3
      na_ontap_interface:
        state: present
        interface_name: peer-lif-cl3-n1
        home_port: e0c
        home_node: cluster3-01
        role: intercluster
        address: 192.168.4.122
        netmask: 255.255.255.0
        vserver: cluster3
        ipspace: Default
        <<: *login3

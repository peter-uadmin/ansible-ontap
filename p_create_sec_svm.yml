---
- hosts: localhost
  gather_facts: false
  vars:
    input: &input
      hostname:         "{{ SEC_CLU }}"
      username:         "{{ SEC_CLU_USER }}"
      password:         "{{ SEC_CLU_PASS }}"
      https:            true
      validate_certs:   false
      use_rest:         Always
  vars_files:
    - p_global.vars
  collections:
    - netapp.ontap

  tasks:
  - name: Create primary SVM
    na_ontap_svm:
      state:            present
      name:             "{{ SEC_SVM }}"
      services:
        nfs:
          allowed:      true
          enabled:      true
      comment:          Created with Ansible
      <<: *input
  - name: Create management interface on primary SVM
    na_ontap_interface:
      state:                 present
      interface_name:        "{{ SEC_SVM }}"
      vserver:               "{{ SEC_SVM }}"
      address:               "{{ SEC_SVM_IP }}"
      netmask:               "{{ SEC_SVM_NETMASK }}"
      home_node:             "{{ SEC_CLU_NODE1 }}"
      home_port:             "{{ SEC_MGMT_PORT }}"
      <<: *input
      service_policy:        "default-management"
      firewall_policy:       mgmt
      role:                  data



---
- hosts: localhost
  gather_facts: false
  vars:
    input: &input
      hostname: "{{ PRI_CLU }}"
      username: "{{ PRI_CLU_USER }}"
      password: "{{ PRI_CLU_PASS }}"
      https: true
      validate_certs: false
      use_rest: Always
  vars_files:
    - p_global.vars
  collections:
    - netapp.ontap

  tasks:
  - name: Retrieve aggregate, SVM, and volume records
    netapp.ontap.na_ontap_rest_info:
      <<: *input
      gather_subset:
        - storage/aggregates
        - svm/svms
        - storage/volumes
    register: ontap_inventory

  - name: Aggregate names
    ansible.builtin.debug:
      msg: "{{ item.name }}"
    loop: "{{ ontap_inventory.ontap_info['storage/aggregates'].records }}"
    loop_control:
      label: "{{ item.name }}"

  - name: SVM names
    ansible.builtin.debug:
      msg: "{{ item.name }}"
    loop: "{{ ontap_inventory.ontap_info['svm/svms'].records }}"
    loop_control:
      label: "{{ item.name }}"

  - name: Volume names
    ansible.builtin.debug:
      msg: "{{ item.name }}"
    loop: "{{ ontap_inventory.ontap_info['storage/volumes'].records }}"
    loop_control:
      label: "{{ item.name }}"
